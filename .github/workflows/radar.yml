name: Charts and cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/toolsmix.json"
      - "assets/projects.json"
      - "scripts/radar.py"
      - "scripts/cards.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Radar de habilidades (edita assets/skills.json para cambiarlo)
      - name: Skill radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      # Radar de arsenal / herramientas ofensivas (edita assets/toolsmix.json)
      - name: Tools radar
        run: python scripts/radar.py --data assets/toolsmix.json -o assets/radar-tools --values

      # Tarjetas de stats y repos, generadas y alojadas en el propio repo
      - name: Stat and repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --projects assets/projects.json \
            --out assets

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-*.svg assets/card-*.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts and cards"
          git push
