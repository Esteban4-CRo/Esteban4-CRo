<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 120" width="100%" height="120" role="img" aria-label="Red Team technology stack">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#080a0d"/>
    <stop offset="0.5" stop-color="#13090b"/>
    <stop offset="1" stop-color="#080a0d"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#8FE04A" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#8FE04A"/>
    <stop offset="1" stop-color="#8FE04A" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="0" y="0" width="1600" height="120" rx="10" fill="url(#bg)" stroke="#2a2f36"/>
<text x="28" y="28" fill="#8FE04A" font-family="monospace" font-size="14" font-weight="700">[+] TECH STACK // ACTIVE SCAN</text>
<text x="1570" y="28" fill="#C81E1E" font-family="monospace" font-size="14" font-weight="700" text-anchor="end">RED_TEAM</text>

<rect x="28" y="43" width="1544" height="1" fill="#252a30"/>
<rect x="28" y="94" width="1544" height="1" fill="#252a30"/>
<rect x="28" y="43" width="1544" height="1" fill="url(#line)" filter="url(#glow)">
  <animate attributeName="x" from="-1544" to="1544" dur="5s" repeatCount="indefinite"/>
</rect>

<g font-family="monospace" font-size="16" font-weight="700">
  <g transform="translate(0 0)">
    <g transform="translate(0 0)">
      <text x="55" y="76" fill="#A8B9CC">C</text>
      <text x="135" y="76" fill="#A8B9CC">C++</text>
      <text x="235" y="76" fill="#3572A5">PYTHON</text>
      <text x="370" y="76" fill="#F7DF1E">JAVASCRIPT</text>
      <text x="535" y="76" fill="#61DAFB">REACT</text>
      <text x="630" y="76" fill="#092E20">DJANGO</text>
      <text x="745" y="76" fill="#2496ED">DOCKER</text>
      <text x="870" y="76" fill="#557C94">LINUX</text>
      <text x="970" y="76" fill="#80B5E3">KALI</text>
      <text x="1065" y="76" fill="#88CCFF">NMAP</text>
      <text x="1165" y="76" fill="#FF6F00">BURP</text>
      <text x="1265" y="76" fill="#00AEEF">WIRESHARK</text>
      <text x="1415" y="76" fill="#C81E1E">METASPLOIT</text>
    </g>
    <g transform="translate(1600 0)">
      <text x="55" y="76" fill="#A8B9CC">C</text>
      <text x="135" y="76" fill="#A8B9CC">C++</text>
      <text x="235" y="76" fill="#3572A5">PYTHON</text>
      <text x="370" y="76" fill="#F7DF1E">JAVASCRIPT</text>
      <text x="535" y="76" fill="#61DAFB">REACT</text>
      <text x="630" y="76" fill="#092E20">DJANGO</text>
      <text x="745" y="76" fill="#2496ED">DOCKER</text>
      <text x="870" y="76" fill="#557C94">LINUX</text>
      <text x="970" y="76" fill="#80B5E3">KALI</text>
      <text x="1065" y="76" fill="#88CCFF">NMAP</text>
      <text x="1165" y="76" fill="#FF6F00">BURP</text>
      <text x="1265" y="76" fill="#00AEEF">WIRESHARK</text>
      <text x="1415" y="76" fill="#C81E1E">METASPLOIT</text>
    </g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1600 0" dur="18s" repeatCount="indefinite"/>
  </g>
</g>

<circle cx="1535" cy="62" r="5" fill="#8FE04A" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/>
</circle>
</svg>
